<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>EzBOM 查看器</title>
    <link rel="stylesheet" href="viewer.css?v=20261114171724">
    <script>
    var EZBOM_WORKER_URL = 'https://ezbom-analytics.notnotnotrobot.workers.dev';
    var EZBOM_STATS_KEY = 'ezbom-stats-key-change-me';
    </script>
    <script src="sanitize.js"></script>
    <script src="analytics.js"></script>
</head>
<body>

    <!-- 载入画面 -->
    <div id="loading">
        <div class="spinner"></div>
        <span id="loading-text">载入产品资料...</span>
        <div id="loading-error"></div>
    </div>

    <!-- 顶部栏 -->
    <div class="topbar">
        <button class="back-btn" onclick="goBack()">← 产品列表</button>
        <h1 id="product-title">载入中...</h1>
        <button class="back-btn" onclick="shareProduct()" title="分享此产品">🔗</button>

    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- SVG 面板 -->
        <div class="svg-panel" id="svg-panel">
            <div class="svg-container" id="svg-container">
                <div style="text-align:center;padding:20px;color:#87867F;font-size:14px;">载入爆炸图...</div>
            </div>
        </div>

        <!-- BOM 面板 -->
        <div class="bom-panel active" id="bom-panel">
            <!-- 统计 -->
            <div>
                <h2>询价统计</h2>
                <div class="stats-summary">
                    <div class="stats-item"><span>已选择</span><strong id="selected-count">0</strong></div>
                    <div class="stats-item"><span>总数量</span><strong id="total-quantity">0</strong></div>
                </div>
            </div>

            <!-- 已选择 -->
            <div>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <h2>已选择零件</h2>
                    <button onclick="undo()" style="padding:2px 8px;border:1px solid #E6E3DA;border-radius:4px;background:white;cursor:pointer;font-size:11px;color:#87867F;" title="复原 (Ctrl+Z)">↩ 复原</button>
                </div>
                <div class="selected-items" id="selected-list"></div>
            </div>

            <!-- 收件信箱 -->
            <div style="margin-bottom:8px;">
                <label style="font-size:12px;color:#87867F;display:block;margin-bottom:4px;">询价收件信箱</label>
                <div style="display:flex;gap:6px;">
                    <input type="email" class="search-box" id="email-input" value=""
                        style="flex:1;margin-bottom:0;" placeholder="输入询价收件信箱...">
                    <button onclick="saveEmail()" style="padding:8px 12px;border:1px solid #E6E3DA;border-radius:6px;background:white;cursor:pointer;font-size:12px;white-space:nowrap;">储存</button>
                </div>
            </div>

            <!-- 发送按钮 -->
            <div style="display:flex;gap:6px;">
                <button class="email-btn" onclick="sendInquiry()" id="email-btn" disabled style="flex:1;">发送询价邮件</button>
                <button onclick="copyInquiry()" id="copy-btn" style="padding:12px 16px;border:1px solid #E6E3DA;border-radius:8px;background:white;cursor:pointer;font-size:14px;color:#D97757;font-weight:600;white-space:nowrap;" title="复制询价清单到剪贴簿">📋 复制</button>
            </div>

            <!-- BOM 清单 -->
            <div>
                <h2>零件清单</h2>
                <input type="text" class="search-box" id="search-box" placeholder="搜寻编号或名称..." oninput="filterBOM()">
                <div class="bom-toolbar">
                    <button onclick="selectAll()">全选 (Ctrl+A)</button>
                    <button onclick="clearAll()">清除 (Esc)</button>
                </div>
                <div class="bom-list-container" role="listbox" aria-label="零件清单"><div id="bom-list"></div></div>
            </div>

            <!-- 采购统计（默认隐藏，由 tab 切换） -->
            <div id="stats-panel" style="display:none;">
                <h2>采购统计</h2>
                <div id="stats-loading" style="text-align:center;padding:20px;color:#87867F;">载入统计资料...</div>
                <div id="stats-content" style="display:none;">
                    <!-- 高频零件 -->
                    <div style="margin-bottom:16px;">
                        <h3 style="font-size:14px;color:#D97757;margin-bottom:8px;">🔥 高频购买零件 TOP 5</h3>
                        <div id="hot-parts-list" style="background:#F0EEE6;border-radius:8px;padding:8px;"></div>
                    </div>
                    <!-- 客户排名 -->
                    <div style="margin-bottom:16px;">
                        <h3 style="font-size:14px;color:#141413;margin-bottom:8px;">🏢 客户购买排名</h3>
                        <div id="customer-stats" style="background:#F0EEE6;border-radius:8px;padding:8px;"></div>
                    </div>
                    <!-- 月度趋势 -->
                    <div style="margin-bottom:16px;">
                        <h3 style="font-size:14px;color:#141413;margin-bottom:8px;">📈 月度购买趋势</h3>
                        <div id="monthly-stats" style="background:#F0EEE6;border-radius:8px;padding:8px;"></div>
                    </div>
                </div>
                <div id="stats-empty" style="display:none;text-align:center;padding:40px;color:#87867F;font-size:14px;">
                    暂无采购数据<br>
                    <small>请在 data/purchases/ 目录下添加采购记录 CSV</small>
                </div>
            </div>
        </div>
    </div>

    <!-- 手机底部 Tab -->
    <div class="mobile-tabs" id="mobile-tabs">
        <button class="active" data-tab="main" onclick="switchTab('main')">
            <span class="tab-icon">🔧</span> 图面＋清单
        </button>
        <button data-tab="stats" onclick="switchTab('stats')" id="stats-tab-btn">
            <span class="tab-icon" id="stats-tab-icon">🔒</span> 采购统计
        </button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 管理员密码弹窗 -->
    <div class="pw-overlay" id="pw-overlay" style="display:none;">
        <div class="pw-dialog">
            <h3>🔒 管理员验证</h3>
            <p>采购统计仅限管理员查看</p>
            <input type="password" id="pw-input" placeholder="请输入管理密码" autocomplete="off">
            <div class="pw-error" id="pw-error">密码错误，请重试</div>
            <button onclick="verifyAdmin()">确认</button>
            <button class="pw-cancel" onclick="closePwModal()">取消</button>
        </div>
    </div>

    <!-- Android mailto 备用方案 -->
    <div class="pw-overlay" id="mailto-fallback" style="display:none;">
        <div class="pw-dialog" style="width:360px;max-width:90vw;text-align:left;">
            <h3 style="text-align:center;">发送询价</h3>
            <p style="text-align:center;margin:4px 0 12px;">请复制以下资讯寄送到：<br><strong id="fallback-email"></strong></p>
            <textarea id="fallback-text" readonly
                style="width:100%;height:140px;font-size:12px;border:1px solid #E6E3DA;border-radius:8px;padding:10px;resize:none;background:#FAF9F5;margin-bottom:12px;"></textarea>
            <button id="fallback-copy-btn" onclick="copyFallbackText()"
                style="width:100%;padding:10px;border:none;border-radius:8px;background:#D97757;color:white;font-size:14px;font-weight:600;cursor:pointer;">
                复制到剪贴簿
            </button>
            <button class="pw-cancel" style="width:100%;margin-top:8px;" onclick="document.getElementById('mailto-fallback').style.display='none'">关闭</button>
        </div>
    </div>

    <script src="viewer.js?v=20261114171724"></script>
</body>
</html>
